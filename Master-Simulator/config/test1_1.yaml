behaviors:
  DroneAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 3000
      buffer_size: 30480
      learning_rate: 0.00001
      beta: 0.0003
      epsilon: 0.05
      lambd: 0.99
      num_epoch: 8
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 1024
      num_layers: 4
      vis_encode_type: nature_cnn
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 50000000
    time_horizon: 1000
    summary_freq: 100

